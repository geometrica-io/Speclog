name: CI
on:
  push:
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Extension smoke tests in a real VS Code; Linux runners have no display, so use xvfb there.
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:ext
      - if: runner.os != 'Linux'
        run: npm run test:ext
