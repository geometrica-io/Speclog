name: Release
on:
  push:
    tags: ['v*']
  # Manual run = dry run: build, test, package, verify the Marketplace token and the Open VSX trusted
  # publisher, but publish nothing.
  workflow_dispatch:
permissions:
  contents: read
  # Open VSX trusted publishing: ovsx exchanges this job's GitHub OIDC token for a short-lived
  # publishing token, so no Open VSX secret is stored.
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches the extension version
        if: ${{ github.event_name == 'push' }}
        run: |
          version=$(node -p "require('./packages/vscode/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/vscode version v$version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: speclog-vsix
          path: packages/vscode/*.vsix
          if-no-files-found: error
      - name: Verify the Marketplace token
        if: ${{ env.VSCE_PAT != '' }}
        run: npx vsce verify-pat "$(node -p "require('./packages/vscode/package.json').publisher")" -p "$VSCE_PAT"
      - name: Publish to the VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' && github.event_name == 'push' }}
        run: npx vsce publish --packagePath packages/vscode/speclog-*.vsix
      # Open VSX steps run once the repository variable OVSX_TRUSTED is "true" (set it after the
      # namespace is verified and the trusted publisher is registered on open-vsx.org).
      - name: Verify the Open VSX trusted publisher
        if: ${{ vars.OVSX_TRUSTED == 'true' }}
        run: node scripts/check-ovsx-trusted-publisher.cjs packages/vscode/package.json
      - name: Publish to Open VSX
        if: ${{ vars.OVSX_TRUSTED == 'true' && github.event_name == 'push' }}
        run: npx ovsx publish packages/vscode/speclog-*.vsix --trusted-publishing
