name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches the extension version
        run: |
          version=$(node -p "require('./packages/vscode/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/vscode version v$version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: speclog-vsix
          path: packages/vscode/*.vsix
          if-no-files-found: error
      - name: Publish to the VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx vsce publish --packagePath packages/vscode/speclog-*.vsix
      - name: Create the Open VSX namespace if it does not exist
        if: ${{ env.OVSX_PAT != '' }}
        run: |
          ns=$(node -p "require('./packages/vscode/package.json').publisher")
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://open-vsx.org/api/$ns")
          if [ "$code" = "404" ]; then
            npx ovsx create-namespace "$ns" -p "$OVSX_PAT"
          elif [ "$code" != "200" ]; then
            echo "Open VSX answered HTTP $code for namespace $ns" >&2
            exit 1
          fi
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx ovsx publish packages/vscode/speclog-*.vsix -p "$OVSX_PAT"
